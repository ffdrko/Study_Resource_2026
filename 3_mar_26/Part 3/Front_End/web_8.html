<!-- Button Exercise -->
<style>
    .sub-btn{
        background-color: rgb(211, 3, 3);
        color: white;
        border: none;
        height: 36px;
        width: 105px;
        border-radius: 2px;
        margin-right: 5px;
        cursor: pointer;
    }

    .sub-btn:hover{
        background-color: green;
    }

    .sub-btn:active{
        background-color: blue;
    }
    .join-btn{
        background-color: white;
        color: rgb(65, 154, 255);
        border: solid;
        border-width: 1px;
        height: 36px;
        width: 70px;
        border-radius: 2px;
        cursor: pointer;    
    }
    .tweet-btn{
        background-color: rgb(65, 154, 255);
        color: white;
        border: none;
        height: 36px;
        width: 80px;
        border-radius: 18px;
        font-weight: bold;
        font-size: 15px;
        margin-left: 5px;
        cursor: pointer;
    }

</style>
<button class="sub-btn">SUBSCRIBE</button>
<button class="join-btn">JOIN</button>
<button class="tweet-btn">Tweet</button>
