<!-- Button Exercise -->
<style>
    .sub-btn{
        background-color: rgb(204, 0, 0);
        color: white;
        border: none;
        padding-top: 7px;
        padding-bottom: 7px;
        padding-left: 15px;
        padding-right: 15px;
        border-radius: 2px;
        margin-right: 5px;
        cursor: pointer;
        transition: opacity 0.15s;
        vertical-align: top;
    }

    .sub-btn:hover{
        opacity: 0.8;
    }

    .sub-btn:active{
        opacity: 0.5;
    }

    .join-btn{
        background-color: white;
        color: rgb(6, 95, 212);
        border: solid;
        border-width: 1px;
        padding-top: 6px;
        padding-bottom: 6px;
        padding-left: 15px;
        padding-right: 15px;
        border-radius: 2px;
        cursor: pointer;    
        transition: background-color 1s, color 1s;
        vertical-align: top;
    }

    .join-btn:hover{
        background-color:  rgb(6, 95, 212);
        color: white;
    }

    .join-btn:active{
        opacity: 0.7;
    }

    .tweet-btn{
        background-color: rgb(29, 155, 240);
        color: white;
        border: none;
        padding-top: 7px;
        padding-bottom: 7px;
        padding-left: 15px;
        padding-right: 15px;
        border-radius: 18px;
        font-weight: bold;
        font-size: 15px;
        margin-left: 5px;
        cursor: pointer;
        transition: box-shadow 0.3s;
        vertical-align: top;
    }

    .tweet-btn:hover{
        box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.3);
    }

    .tweet-btn:active{
        opacity: 0.6;
        box-shadow: none;
    }
</style>
<button class="sub-btn">SUBSCRIBE</button>
<button class="join-btn">JOIN</button>
<button class="tweet-btn">Tweet</button>
